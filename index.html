<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SQL Injection Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <h1>🔓 SQL Injection Demo</h1>
        <p class="subtitle">Educational demonstration of SQL injection vulnerabilities</p>

        <div id="login-box">
            <h2>Login</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Login</button>
        </div>
        <div id="result-box" class="hidden"></div>
        <div id="hint-box">
            <h3>💡 Try these inputs:</h3>
            <div class="hint-item" id="hint-normal">✅ Normal login:admin / password123</div>
            <div class="hint-item" id="hint-wrong">❌ Wrong password: admin / wrongpass</div>
            <div class="hint-item" id="hint-sqli">💥 SQL Injection: ' OR '1'='1 / anything</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
